<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/public/favicon-32x32.png" />
  <link rel="stylesheet" href="/src/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmark</title>
</head>

<body class="text-grey m-0">

  <header class="flex justify-between items-center w-[80vw] m-auto pt-3 pb-2">
    <img src="images/logo-bookmark.svg" alt="bookmark logo">

    <nav
      class="group z-0 has-checked:fixed has-checked:inset-0 has-checked:bg-blue-menu has-checked:flex has-checked:justify-between has-checked:flex-wrap has-checked:items-start has-checked:py-3 has-checked:px-[10vw]">
      <img src="images/logo-bookmark-menu.svg" alt="bookmark logo" class="hidden group-has-checked:block">
      <label for="menu-toggle" aria-label="open/close menu" class="relative">
        <input type="checkbox" class="absolute z-2 opacity-0" />
        <img src="images/icon-hamburger.svg" id="menu-icon" alt="" class="group-has-checked:hidden md:hidden">
        <img src="images/icon-close.svg" id="close-icon" alt="" class="hidden group-has-checked:block">
      </label>
      <ul
        class="gap-3 hidden text-center text-grey-dark uppercase group-has-checked:block group-has-checked:w-full group-has-checked:mx-2 group-has-checked:text-white md:flex">
        <li class="group-has-checked:py-1.5 group-has-checked:border-t-1 group-has-checked:border-border"><a href="#"
            tabindex="0">Features</a></li>
        <li class="group-has-checked:py-1.5 group-has-checked:border-t-1 group-has-checked:border-border"><a href="#"
            tabindex="0">Pricing</a></li>
        <li class="group-has-checked:py-1.5 group-has-checked:border-t-1 group-has-checked:border-border"><a href="#"
            tabindex="0">Contact</a></li>
        <li class="group-has-checked:py-1.5 group-has-checked:border-t-1 group-has-checked:border-border"><a
            class="group-has-checked:block group-has-checked:p-1 group-has-checked:border-2 group-has-checked:rounded-lg md:bg-red md:text-white md:rounded-md md:px-2 md:py-0.75 hover:bg-white hover:text-red border-2 border-red"
            href="#" tabindex="0">Login</a></li>
      </ul>
      <div class="hidden gap-2.5 m-auto group-has-checked:flex md:hidden"><a href="#">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24">
            <path fill="#FFF" fill-rule="evenodd"
              d="M22.675 0H1.325C.593 0 0 .593 0 1.325v21.351C0 23.407.593 24 1.325 24H12.82v-9.294H9.692v-3.622h3.128V8.413c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12V24h6.116c.73 0 1.323-.593 1.323-1.325V1.325C24 .593 23.407 0 22.675 0z" />
          </svg></a>
        <a href="#">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="20">
            <path fill="#FFF" fill-rule="evenodd"
              d="M24 2.557a9.83 9.83 0 0 1-2.828.775A4.932 4.932 0 0 0 23.337.608a9.864 9.864 0 0 1-3.127 1.195A4.916 4.916 0 0 0 16.616.248c-3.179 0-5.515 2.966-4.797 6.045A13.978 13.978 0 0 1 1.671 1.149a4.93 4.93 0 0 0 1.523 6.574 4.903 4.903 0 0 1-2.229-.616c-.054 2.281 1.581 4.415 3.949 4.89a4.935 4.935 0 0 1-2.224.084 4.928 4.928 0 0 0 4.6 3.419A9.9 9.9 0 0 1 0 17.54a13.94 13.94 0 0 0 7.548 2.212c9.142 0 14.307-7.721 13.995-14.646A10.025 10.025 0 0 0 24 2.557z" />
          </svg>
        </a>
      </div>
    </nav>


  </header>

</body>

</html>
